  <!-- Preconnect para dominios externos (mejora LCP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" />
  
  <!-- Carga asíncrona de fuentes -->
  <link rel="stylesheet"

    onload="this.media='all'" />

    media="print" 
    onload="this.media='all'" />
  
  <!-- Critical CSS inline (evita render blocking) -->
  <style>
    /* Critical CSS para render inicial */
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { min-height: 100vh; background-color: #ffffff; }
    
    /* Loader inicial mientras carga React */
    #root:empty::before {
      content: '';
      display: block;
      width: 100%;
      height: 100vh;
      background: linear-gradient(to bottom, #f8fafc, #ffffff);
    }
    
    /* Evitar FOUC (Flash of Unstyled Content) */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />

</head>
